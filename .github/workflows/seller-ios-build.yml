name: Seller Studio iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app-seller-ios/**', '.github/workflows/seller-ios-build.yml']

jobs:
  build:
    runs-on: macos-26
    env:
      HAS_PROFILE: ${{ secrets.SELLER_PROVISION_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: xcodegen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        working-directory: app-seller-ios
        run: xcodegen

      # Variante A: Signierter App-Store-Build (Secrets vorhanden)
      - name: Signierte App archivieren
        working-directory: app-seller-ios
        if: ${{ env.HAS_PROFILE == 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.SELLER_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > /tmp/seller.mobileprovision
          cp /tmp/seller.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          xcodebuild -scheme TurabazaarSaleStudio \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/SaleStudio.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Turabazaar Sale Studio App Store" \
            archive
          xcodebuild -exportArchive \
            -archivePath build/SaleStudio.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: IPA zu App Store Connect hochladen
        working-directory: app-seller-ios
        if: ${{ env.HAS_PROFILE == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f build/ipa/TurabazaarSaleStudio.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_PASSWORD"

      - name: IPA als Artefakt speichern
        if: ${{ env.HAS_PROFILE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SaleStudio-iOS
          path: app-seller-ios/build/ipa/*.ipa

      # Variante B: Unsigneder Build (Fallback, ohne Store-Signierung)
      - name: Unsigned bauen (kein Signing nötig)
        working-directory: app-seller-ios
        if: ${{ env.HAS_PROFILE == 'false' }}
        run: |
          xcodebuild -scheme TurabazaarSaleStudio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          cd build/Build/Products/Release-iphonesimulator
          zip -r "$OLDPWD/SaleStudio-unsigned.zip" TurabazaarSaleStudio.app

      - name: Unsigned-Build als Artefakt
        if: ${{ env.HAS_PROFILE == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: SaleStudio-iOS-unsigned
          path: app-seller-ios/SaleStudio-unsigned.zip
