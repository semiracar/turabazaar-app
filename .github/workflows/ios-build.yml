name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app-ios/**', '.github/workflows/ios-build.yml']

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: xcodegen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        working-directory: app-ios
        run: xcodegen

      - name: Distribution-Zertifikat importieren
        env:
          P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          security find-identity -v -p codesigning

      - name: Provisioning-Profil installieren
        env:
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > /tmp/turabazaar.mobileprovision
          cp /tmp/turabazaar.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Signierte App archivieren
        working-directory: app-ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -scheme Turabazaar \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Turabazaar.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Turabazaar App Store" \
            archive

      - name: IPA exportieren (App Store)
        working-directory: app-ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>W6Q8QMSJH5</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.turabazaar.app</key><string>Turabazaar App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Turabazaar.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: IPA als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: Turabazaar-iOS
          path: app-ios/build/ipa/*.ipa

      - name: Zu App Store Connect hochladen
        working-directory: app-ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f build/ipa/Turabazaar.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_PASSWORD"
