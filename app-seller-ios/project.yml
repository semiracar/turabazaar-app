name: TurabazaarSaleStudio
options:
  bundleIdPrefix: com.turabazaar
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  TurabazaarSaleStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources/TurabazaarSeller
      - path: Sources/Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Sale Studio
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Kamera-Zugriff für Produktfotos beim Verkaufen."
        NSPhotoLibraryUsageDescription: "Foto-Zugriff zum Hochladen von Produktbildern."
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.turabazaar.seller
            CFBundleURLSchemes:
              - turabazaar-seller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.turabazaar.seller
        DEVELOPMENT_TEAM: W6Q8QMSJH5
        CODE_SIGN_STYLE: Automatic
